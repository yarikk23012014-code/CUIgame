    const { useState, useEffect, useCallback, useRef } = React;

    function useLocalStorage(key, initialValue) {
        const [storedValue, setStoredValue] = useState(() => {
            try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : initialValue; }

    // ----- 12 игр (полные функции) -----
    function getClickerGame(saved) { const start = saved?.score || 0; return '<!DOCTYPE html><html><head><style>body{background:#1e1e2f;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:system-ui;}.game{text-align:center;color:white;}button{font-size:28px;padding:16px 32px;border-radius:60px;background:#4f46e5;color:white;cursor:pointer;}.score{font-size:48px;font-weight:bold;}</style></head><body><div class="game"><h2>🍪 Печеньки</h2><div class="score" id="counter">'+start+'</div><button id="clickBtn">Клик!</button></div><script>let count='+start+';const c=document.getElementById("counter");document.getElementById("clickBtn").onclick=()=>{count++;c.innerText=count;window.parent.postMessage({type:"saveProgress",gameId:"clicker",progress:{score:count}},"*");};window.addEventListener("load",()=>window.parent.postMessage({type:"saveProgress",gameId:"clicker",progress:{score:count}},"*"));<\/script></body></html>'; }
    function getSnakeGame(saved) { const data = saved || { score: 0, wrapAround: false }; return '<!DOCTYPE html><html><head><style>body{background:#0a0f1e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{background:#1e293b;}</style></head><body><canvas id="canvas" width="400" height="400"></canvas><div><span id="score">'+data.score+'</span> <label><input type="checkbox" id="wrap" '+ (data.wrapAround?'checked':'') +'> Сквозь стены</label> <button id="reset">Новая</button></div><script>(function(){const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");let grid=20,cell=20,snake=[{x:10,y:10}],dir="RIGHT",next="RIGHT",food={x:15,y:10},score='+data.score+',wrap='+data.wrapAround+',gameActive=true,loop;function save(){window.parent.postMessage({type:"saveProgress",gameId:"snake",progress:{score,wrapAround:wrap}},"*");}function randomFood(){let free=[];for(let i=0;i<grid;i++)for(let j=0;j<grid;j++)if(!snake.some(s=>s.x===i&&s.y===j))free.push({x:i,y:j});return free.length?free[Math.floor(Math.random()*free.length)]:null;}function draw(){ctx.fillStyle="#1e293b";ctx.fillRect(0,0,400,400);ctx.fillStyle="#facc15";ctx.fillRect(food.x*cell,food.y*cell,cell-1,cell-1);ctx.fillStyle="#10b981";snake.forEach(s=>ctx.fillRect(s.x*cell,s.y*cell,cell-1,cell-1));}function move(){if(!gameActive)return;dir=next;let head={...snake[0]};if(dir==="RIGHT")head.x++;if(dir==="LEFT")head.x--;if(dir==="UP")head.y--;if(dir==="DOWN")head.y++;let hit=false;if(wrap){if(head.x<0)head.x=grid-1;if(head.x>=grid)head.x=0;if(head.y<0)head.y=grid-1;if(head.y>=grid)head.y=0;}else{if(head.x<0||head.x>=grid||head.y<0||head.y>=grid)hit=true;}let self=snake.some(s=>s.x===head.x&&s.y===head.y);if(hit||self){gameActive=false;clearInterval(loop);loop=null;alert("Game over");return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById("score").innerText=score;let f=randomFood();if(f)food=f;else{gameActive=false;clearInterval(loop);alert("You win!");}save();}else{snake.pop();}draw();}function start(){if(loop)clearInterval(loop);gameActive=true;snake=[{x:10,y:10}];dir="RIGHT";next="RIGHT";score=0;document.getElementById("score").innerText=score;food=randomFood()||{x:5,y:5};draw();loop=setInterval(move,130);save();}document.getElementById("reset").onclick=start;document.getElementById("wrap").onchange=e=>{wrap=e.target.checked;save();};window.addEventListener("keydown",e=>{if(!gameActive)return;if(e.key==="ArrowUp"&&dir!=="DOWN")next="UP";if(e.key==="ArrowDown"&&dir!=="UP")next="DOWN";if(e.key==="ArrowLeft"&&dir!=="RIGHT")next="LEFT";if(e.key==="ArrowRight"&&dir!=="LEFT")next="RIGHT";});start();})();<\/script></body></html>'; }

            if (openGames.length > 0) {
                localStorage.setItem('openGames', JSON.stringify(openGames.map(g => ({ id: g.id, title: g.title, gameId: g.gameId, isBuiltIn: g.isBuiltIn }))));
                localStorage.setItem('activeGameId', activeGameId);
            } else {
                localStorage.removeItem('openGames');
                localStorage.removeItem('activeGameId');
            }
        }, [openGames, activeGameId]);
        
        // Восстановление вкладок
        useEffect(() => {
            const savedGames = localStorage.getItem('openGames');
            const savedActive = localStorage.getItem('activeGameId');
            if (savedGames && !loading) {
                const gamesArray = JSON.parse(savedGames);
                const restored = [];
                for (const g of gamesArray) {
                    const found = allGames.find(ag => ag.id === g.gameId);
                    if (found) {
                        const finalHtml = found.isBuiltIn ? found.getHtmlFunc(gameProgress[g.gameId] || null) : found.html;
                        restored.push({ ...g, html: finalHtml, getHtmlFunc: found.isBuiltIn ? found.getHtmlFunc : null });
                    }
                }
                setOpenGames(restored);
                setActiveGameId(savedActive);
            }
        }, [loading, gameProgress]);
        
        const downloadGame = (project) => {
            const html = project.isBuiltIn ? (builtinEdits[project.id]?.html || project.getHtmlFunc(gameProgress[project.id] || null)) : project.html;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${project.title}.html`; a.click();
            URL.revokeObjectURL(url);
        };
        const startMazeWithSize = (size) => {
            const project = mazeSizeModal; setMazeSizeModal(null);
            addToHistory(project.id, project.title);
            setGameProgress(prev => ({ ...prev, [project.id]: { ...(prev[project.id] || {}), size } }));
            const html = project.getHtmlFunc({ size });
            const newGame = {
                id: Date.now().toString(),
                title: project.title,
                gameId: project.id,
                html,
                isBuiltIn: true,
                getHtmlFunc: project.getHtmlFunc
            };
            setOpenGames([...openGames, newGame]);
            setActiveGameId(newGame.id);
        };
        const showGameStats = async (game) => {
            const activeSnapshot = await db.collection('activeSessions').where('gameId', '==', game.id).get();
            const activePlayers = activeSnapshot.docs.map(d => ({ nickname: d.data().nickname }));
            const usersSnap = await db.collection('users').get();
            const allPlayers = [];
            usersSnap.docs.forEach(doc => {
                const played = (doc.data().gameHistory || []).find(h => h.id === game.id);
                if (played) allPlayers.push({ nickname: doc.data().nickname || doc.data().email, lastPlayed: played.firstPlayed });
            });
            setStatsModal({ open: true, game, stats: { activePlayers, allPlayers } });
        };
        const updateAvatar = async () => {
            await db.collection('users').doc(user.uid).update({ avatar: avatarUrlInput.trim() || null });
            setUserData(prev => ({ ...prev, avatar: avatarUrlInput.trim() || null }));
            setAvatarUrlInput('');
            alert('Аватар обновлён');
        };
        
        // Чат
        const sendMessage = async () => {
            if (isMuted) { alert('Вы в муте и не можете писать в чат'); return; }
            if (!newMessage.trim() || !selectedChatUser) return;
            const badWordFound = BAD_WORDS.some(w => newMessage.toLowerCase().includes(w));
            if (badWordFound && isAdmin) {
                await muteUser(selectedChatUser.uid, 24);
                alert('Пользователь замучен на 24 часа за использование плохих слов');
                loadAllUsers();
                return;
            } else if (badWordFound) {
                alert('Ваше сообщение содержит запрещённые слова');
                return;
            }
            const chatId = [user.uid, selectedChatUser.uid].sort().join('_');
            const chatRef = db.collection('chats').doc(chatId);
            const message = { text: newMessage, sender: user.uid, timestamp: new Date().toISOString(), readBy: [user.uid], type: 'text' };
            await chatRef.set({ participants: [user.uid, selectedChatUser.uid] }, { merge: true });
            await chatRef.collection('messages').add(message);
            setNewMessage('');
            setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
        };
        
        const selectChatUser = async (otherUser) => {
            if (chatUnsubscribeRef.current) chatUnsubscribeRef.current();
            setSelectedChatUser(otherUser);
            setSelectedGroup(null);
            setSelectedGroupForMembers(null);
            const chatId = [user.uid, otherUser.uid].sort().join('_');
            const chatRef = db.collection('chats').doc(chatId);
            const messagesSnap = await chatRef.collection('messages').get();
            const batch = db.batch();
            messagesSnap.docs.forEach(doc => {
                const data = doc.data();
                if (!data.readBy?.includes(user.uid)) {
                    batch.update(doc.ref, { readBy: firebase.firestore.FieldValue.arrayUnion(user.uid) });
                }
            });
            await batch.commit();
            const unsubscribe = chatRef.collection('messages').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                setChatMessages(msgs);
                setTimeout(() => messagesEndRef.current?.scrollIntoView(), 100);
            });
            chatUnsubscribeRef.current = unsubscribe;
        };
        
        const toggleFavorite = async (userId) => {
            const newFav = { ...favChats, [userId]: !favChats[userId] };
            setFavChats(newFav);
            await db.collection('users').doc(user.uid).update({ favChats: newFav });
        };
        
        // Группы
        const selectGroupForMembers = (group) => {
            setSelectedGroupForMembers(group);
            setSelectedGroup(null);
            setSelectedChatUser(null);
        };
        const selectGroupChat = async (group) => {
            if (chatUnsubscribeRef.current) chatUnsubscribeRef.current();
            setSelectedGroup(group);
            setSelectedChatUser(null);
            setSelectedGroupForMembers(null);
            const unsubscribe = db.collection('groups').doc(group.id).onSnapshot(doc => {
                if (doc.exists) setGroupMessages(doc.data().messages || []);
                else setGroupMessages([]);
                setTimeout(() => messagesEndRef.current?.scrollIntoView(), 100);
            });
            chatUnsubscribeRef.current = unsubscribe;
        };
        const sendGroupMessage = async (text) => {
            if (isMuted) { alert('Вы в муте и не можете писать в чат'); return; }
            if (!text.trim() || !selectedGroup) return;
            const badWordFound = BAD_WORDS.some(w => text.toLowerCase().includes(w));
            if (badWordFound && isAdmin) {
                alert('Администратор, вы не можете использовать плохие слова');
                return;
            } else if (badWordFound) {
                alert('Ваше сообщение содержит запрещённые слова');
                return;
            }
            const message = { text, sender: user.uid, timestamp: new Date().toISOString(), readBy: [user.uid], type: 'text' };
            await db.collection('groups').doc(selectedGroup.id).update({ messages: firebase.firestore.FieldValue.arrayUnion(message) });
            setNewMessage('');
            setTimeout(() => messagesEndRef.current?.scrollIntoView(), 100);
        };
        const createGroup = async (name, initialUserId) => {

        const addToExistingGroup = async (groupId, userId) => {

        const handleMessageContextMenu = (e, message) => {
            e.preventDefault();
            setContextMenu({ visible: true, x: e.clientX, y: e.clientY, message });
        };
        const copyMessageText = () => {
            if (contextMenu.message) {
                navigator.clipboard.writeText(contextMenu.message.text);

        const deleteMessage = async () => {

                const chatId = [user.uid, selectedChatUser.uid].sort().join('_');
                const chatRef = db.collection('chats').doc(chatId);
                await chatRef.collection('messages').doc(contextMenu.message.id).delete();
            } else if (selectedGroup) {
                const groupRef = db.collection('groups').doc(selectedGroup.id);
                const newMessages = groupMessages.filter(m => m.id !== contextMenu.message.id);
                await groupRef.update({ messages: newMessages });

            setContextMenu({ visible: false, x: 0, y: 0, message: null });
        };
        
        // Подсветка обновлений
        useEffect(() => {

                const seenSnap = await db.collection('users').doc(user.uid).collection('gameSeen').get();

                seenSnap.docs.forEach(d => { seen[d.id] = d.data().lastSeen?.toDate?.() || null; });

            };
            fetchSeen();

        const isGameUpdated = (game) => {
            if (!game.lastEdited) return false;
            const lastSeen = userLastSeen[game.id];
            if (!lastSeen) return true;
            return game.lastEdited > lastSeen;
        };
        
        // Сортировка игр
        const getSortedGames = (games) => {
            const sorted = [...games];
            switch (sortType) {
                case 'popular': sorted.sort((a,b) => (b.playersCount||0) - (a.playersCount||0)); break;
                case 'new': sorted.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); break;
                case 'old': sorted.sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); break;
                case 'unpopular': sorted.sort((a,b) => (a.playersCount||0) - (b.playersCount||0)); break;
                default: break;
            }
            return sorted;
        };
        
        const openRightDrawer = async (tab) => { await loadAllUsers(); setDrawerTab(tab); setIsRightDrawerOpen(true); };

                        if (g.gameId === gameId && g.isBuiltIn && g.getHtmlFunc) {
                            const newHtml = g.getHtmlFunc(progress);
                            return { ...g, html: newHtml };
                        }
                        return g;
                    }));
                }
            };
            window.addEventListener('message', handler);
            return () => window.removeEventListener('message', handler);
        }, []);
        
        const messagesEndRef = useRef(null);

                                <h4>📜 Лицензионное соглашение</h4>
                                <p>Использование некультурных знаков, мата, оскорблений влечёт за собой блокировку аккаунта.</p>
                                <p>Создание пустых игр или спам играми является нарушением и карается баном.</p>
                                <p>Повторные нарушения: бан аккаунта. Администрация оставляет за собой право блокировать любого пользователя без объяснения причин.</p>
                                <p>Нажимая "Принимаю", вы соглашаетесь с этими правилами.</p>
                            </div>
                            <label className="checkbox-label">
                                <input type="checkbox" checked={licenseAccepted} onChange={e => setLicenseAccepted(e.target.checked)} />
                                Я принимаю условия лицензионного соглашения
                            </label>
                            <input type="text" placeholder="Никнейм" value={nickname} onChange={e => setNickname(e.target.value)} />
                        </>
                    )}
                    <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
                    <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} />
                    {authError && <div className="error">{authError}</div>}
                    <button onClick={authMode === 'login' ? handleLogin : checkLicenceAndRegister}>{authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                    <button className="google-btn" onClick={signInWithGoogle}>Войти через Google</button>
                    <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}>{authMode === 'login' ? 'Нет аккаунта? Создать' : 'Уже есть аккаунт? Войти'}</button>
                </div>
            );
        }
        if (nicknameModalOpen) {
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <h2>Придумайте никнейм</h2>
                        <input type="text" placeholder="Никнейм" onChange={e => setNickname(e.target.value)} />
                        <button onClick={() => handleSetNickname(nickname)}>Сохранить</button>
                    </div>
                </div>
            );
        }
        
        // Сборка игр
        const enrichedBuiltin = builtinProjects.map(g => {
            const edit = builtinEdits[g.id];
            return { ...g, title: edit?.title || g.title, html: edit?.html, getHtmlFunc: edit?.html ? () => edit.html : g.getHtmlFunc, lastEdited: edit?.lastEdited?.toDate?.() || null, publicVisible: !(edit?.hidden === true), playersCount: edit?.playersCount || 0, createdAt: g.createdAt, previewImageUrl: edit?.previewImageUrl || null };
        });
        const enrichedCustom = customGames.map(g => ({ ...g, isBuiltIn: false, authorPremium: usersList.find(u => u.uid === g.authorId)?.premium || false }));
        let allGames = [...enrichedBuiltin, ...enrichedCustom];
        let displayedGames = allGames.filter(g => {
            if (!g.publicVisible && !isAdmin && g.authorId !== user.uid) return false;
            if (filterType === 'my') return g.authorId === user.uid && !g.isBuiltIn;
            if (filterType === 'premium') return g.authorPremium === true;
            return true;
        });
        if (searchQuery) displayedGames = displayedGames.filter(g => g.title.toLowerCase().includes(searchQuery.toLowerCase()));
        displayedGames = getSortedGames(displayedGames);
        const gamesWithProgress = Object.keys(gameProgress).filter(id => gameProgress[id] && Object.keys(gameProgress[id]).length).map(id => allGames.find(g => g.id === id)).filter(Boolean);
        
        // Чат: фильтр пользователей с учётом бана, мута, глобального скрытия
        const isGlobalHidden = globalHideUntil && new Date() < globalHideUntil;
        const chatAvailableUsers = usersList.filter(u => u.uid !== user.uid && !u.banned && (!isGlobalHidden || isAdmin) && (!u.muteUntil || new Date(u.muteUntil) < new Date()));
        const userGroups = groups.filter(g => g.participants.includes(user.uid));
        let filteredChats = [];
        if (chatFilter === 'fav') {
            filteredChats = chatAvailableUsers.filter(u => favChats[u.uid]);
        } else if (chatFilter === 'groups') {
            // группы показываются отдельно
        } else {
            filteredChats = chatAvailableUsers;
        }
        
        return (

                    <div style={{display:'flex', alignItems:'center'}}>

                        <button className="account-btn" onClick={() => openRightDrawer('profile')}>

                            {userData?.nickname || user.email.split('@')[0]} {isPremium && <span className="premium-star">⭐</span>} {isAdmin && <span className="admin-badge">Админ</span>}
                            {isMuted && <span className="muted-tag">Muted</span>}
                            {Object.values(unreadCounts).some(c => c > 0) && <span className="unread-dot"></span>}
                        </button>
                    </div>
                </header>
                
                {isMuted && (
                    <div className="mute-info">
                        ⚠️ {formatMuteRemaining(muteRemainingMs)} ⚠️

                    <button className={`sort-btn ${sortType === 'unpopular' ? 'active' : ''}`} onClick={() => setSortType('unpopular')}>Непопулярные</button>
                </div>
                
                <main className="projects-grid">

                                        <iframe className="preview-iframe" srcDoc={proj.isBuiltIn ? (proj.getHtmlFunc?.(null) || '') : proj.html} sandbox="allow-scripts allow-same-origin" title={proj.title} />

                        </aside>
                    </div>

                {/* Правая шторка */}

                                {drawerTab === 'profile' && (
                                    <div className="account-info">
                                        {userData?.avatar ? <img src={userData.avatar} className="account-avatar-large" alt="avatar" onClick={() => setFullscreenAvatar(userData.avatar)} /> : <div className="account-avatar-large">{(userData?.nickname?.[0] || user.email[0]).toUpperCase()}</div>}
                                        <div className="avatar-input">
                                            <input type="text" placeholder="URL аватара" value={avatarUrlInput} onChange={e => setAvatarUrlInput(e.target.value)} />
                                            <button onClick={updateAvatar}>Сохранить аватар</button>
                                        </div>
                                        <div className="avatar-input">
                                            <input type="text" placeholder="Новый никнейм" value={newNickname} onChange={e => setNewNickname(e.target.value)} />
                                            <button onClick={changeNickname}>Сменить ник</button>
                                        </div>
                                        <div className="account-nick">{userData?.nickname || user.email.split('@')[0]} {isPremium && <span className="premium-star">⭐</span>} {isAdmin && <span className="admin-badge">Админ</span>}</div>
                                        <div className="account-email">{user.email}</div>
                                        <div className="cooldown-info">{formatCooldown(cooldownRemainingMs)}</div>
                                        <button className="logout-btn" onClick={logout}>Выйти</button>
                                    </div>
                                )}
                                {drawerTab === 'chat' && (
                                    <div>
                                        <div className="chat-filter-buttons">
                                            <div className={`chat-filter-btn ${chatFilter === 'all' ? 'active' : ''}`} onClick={() => setChatFilter('all')}>Все чаты</div>
                                            <div className={`chat-filter-btn ${chatFilter === 'fav' ? 'active' : ''}`} onClick={() => setChatFilter('fav')}>⭐ Избранные</div>
                                            <div className={`chat-filter-btn ${chatFilter === 'groups' ? 'active' : ''}`} onClick={() => setChatFilter('groups')}>👥 Группы</div>
                                        </div>
                                        {!selectedChatUser && !selectedGroup && !selectedGroupForMembers ? (
                                            <>
                                                {chatFilter !== 'groups' && (
                                                    <div className="chat-users-list">
                                                        {filteredChats.map(u => (
                                                            <div key={u.uid} className="chat-user-item">
                                                                <div className="chat-user-info" onClick={() => selectChatUser(u)}>
                                                                    {u.avatar ? <img src={u.avatar} className="user-avatar" alt="avatar" onClick={(e)=>{ e.stopPropagation(); setFullscreenAvatar(u.avatar); }} /> : <div className="user-avatar">{u.nickname?.[0] || u.email[0].toUpperCase()}</div>}
                                                                    <div>{u.nickname || u.email} {u.premium && '⭐'} {u.isAdmin && '👑'}</div>
                                                                    {unreadCounts[u.uid] > 0 && <span style={{background:'var(--unread-dot)', color:'white', borderRadius:'12px', padding:'2px 8px'}}>{unreadCounts[u.uid]}</span>}
                                                                </div>
                                                                <button className={`chat-star ${favChats[u.uid] ? '' : 'chat-star-off'}`} onClick={() => toggleFavorite(u.uid)}>★</button>
                                                                <button className="chat-star" onClick={() => setGroupCreateModal({ open: true, userId: u.uid })}>+</button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                                {chatFilter === 'groups' && (
                                                    <div>
                                                        {userGroups.map(g => (
                                                            <div key={g.id} className="group-item" onClick={() => selectGroupForMembers(g)}>
                                                                <div className="user-avatar">👥</div>
                                                                <div>{g.name}</div>
                                                            </div>
                                                        ))}
                                                        <button className="group-create-btn" onClick={() => { const uid = prompt('Введите ID пользователя для создания группы'); if(uid) setGroupCreateModal({ open: true, userId: uid }); }}>+ Создать группу</button>
                                                    </div>
                                                )}
                                            </>
                                        ) : selectedGroupForMembers ? (
                                            <div>
                                                <button className="back-button" onClick={() => setSelectedGroupForMembers(null)}>← Назад к списку групп</button>
                                                <h3>Участники группы: {selectedGroupForMembers.name}</h3>
                                                <div className="group-members-list">
                                                    {selectedGroupForMembers.participants.map(pid => {
                                                        const member = usersList.find(u => u.uid === pid);
                                                        return member && (
                                                            <div key={member.uid} className="group-member-item" onClick={() => selectChatUser(member)}>
                                                                {member.avatar ? <img src={member.avatar} className="user-avatar" alt="avatar" /> : <div className="user-avatar">{member.nickname?.[0] || member.email[0].toUpperCase()}</div>}
                                                                <div>{member.nickname || member.email} {member.premium && '⭐'} {member.isAdmin && '👑'}</div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="chat-conversation">
                                                <button className="back-button" onClick={() => { if(chatUnsubscribeRef.current) chatUnsubscribeRef.current(); setSelectedChatUser(null); setSelectedGroup(null); }}>← Назад</button>
                                                <div className="chat-messages">
                                                    {(selectedChatUser ? chatMessages : groupMessages).map((msg, idx) => (
                                                        <div key={idx} className={`message ${msg.sender === user.uid ? 'sent' : 'received'}`}
                                                            onContextMenu={(e) => handleMessageContextMenu(e, msg)}>
                                                            <div>{msg.text}</div>
                                                            <div className="message-time">{msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</div>
                                                        </div>
                                                    ))}
                                                    <div ref={messagesEndRef} />
                                                </div>
                                                {!isMuted && (
                                                    <div className="chat-input-area">
                                                        <input className="chat-input" value={newMessage} onChange={e => setNewMessage(e.target.value)} onKeyPress={e => e.key === 'Enter' && (selectedChatUser ? sendMessage() : selectedGroup ? sendGroupMessage(newMessage) : null)} placeholder="Сообщение..." />
                                                        <button onClick={() => { if (selectedChatUser) sendMessage(); else if (selectedGroup) sendGroupMessage(newMessage); }}>Отправить</button>
                                                    </div>
                                                )}
                                                {isMuted && <div className="mute-info">{formatMuteRemaining(muteRemainingMs)}</div>}
                                            </div>
                                        )}
                                    </div>
                                )}
                                {drawerTab === 'admin' && isAdmin && (
                                    <div>
                                        <div className="admin-tabs">
                                            <div className={`admin-tab ${adminFilterBan === 'all' ? 'active' : ''}`} onClick={() => setAdminFilterBan('all')}>Все</div>
                                            <div className={`admin-tab ${adminFilterBan === 'banned' ? 'active' : ''}`} onClick={() => setAdminFilterBan('banned')}>Забаненные</div>
                                            <div className={`admin-tab ${adminFilterBan === 'notBanned' ? 'active' : ''}`} onClick={() => setAdminFilterBan('notBanned')}>Не забаненные</div>
                                            <div className={`admin-tab ${adminFilterBan === 'muted' ? 'active' : ''}`} onClick={() => setAdminFilterBan('muted')}>Замученные</div>
                                        </div>
                                        <div className="admin-search"><input type="text" placeholder="Поиск по нику или email" value={adminSearch} onChange={e => setAdminSearch(e.target.value)} /></div>
                                        {filteredUsers.map(u => (
                                            <div key={u.uid} className="admin-user-row">
                                                <div className="user-avatar" onClick={() => setFullscreenAvatar(u.avatar)}>{u.avatar ? <img src={u.avatar} style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}} alt="avatar" /> : (u.nickname?.[0] || '?')}</div>
                                                <div style={{flex:1}}>
                                                    <div><strong>{u.nickname || u.email}</strong> {u.premium && '⭐'} {u.isAdmin && '👑'} {u.banned && '🚫'} {u.muteUntil && new Date(u.muteUntil) > new Date() && <span className="muted-tag">Muted</span>} <span className="user-uid">({u.uid.substring(0,8)})</span></div>
                                                    <div style={{display:'flex', gap:'8px', marginTop:'4px', flexWrap:'wrap'}}>
                                                        <input type="text" placeholder="Новый ник" size="10" id={`nick-${u.uid}`} />
                                                        <button onClick={() => { const inp = document.getElementById(`nick-${u.uid}`); changeUserNickname(u.uid, inp.value); inp.value=''; }}>Сменить ник</button>
                                                        <input type="text" placeholder="URL аватара" size="12" id={`avatar-${u.uid}`} />
                                                        <button onClick={() => { const inp = document.getElementById(`avatar-${u.uid}`); changeUserAvatar(u.uid, inp.value); inp.value=''; }}>Сменить аватар</button>
                                                    </div>
                                                </div>
                                                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                                                    {u.email !== 'yarikk23012014@gmail.com' && (
                                                        <button onClick={() => toggleBanUser(u.uid, !u.banned)}>{u.banned ? 'Разбанить' : 'Забанить'}</button>
                                                    )}
                                                    <button onClick={() => togglePremium(u.uid, !u.premium)}>{u.premium ? 'Снять премиум' : '⭐ Дать премиум'}</button>
                                                    {u.email !== 'yarikk23012014@gmail.com' && (
                                                        <button onClick={() => toggleAdmin(u.uid, !u.isAdmin)}>{u.isAdmin ? 'Забрать админку' : 'Сделать админом'}</button>
                                                    )}
                                                    {u.muteUntil && new Date(u.muteUntil) > new Date() ? (
                                                        <button onClick={() => unmuteUser(u.uid)}>Снять мут</button>
                                                    ) : (
                                                        <button onClick={() => { const hours = prompt('Количество часов мута:', '24'); if(hours) muteUser(u.uid, parseInt(hours)); }}>Замутить</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                        <div style={{marginTop:'16px'}}>
                                            <h3>Глобальное скрытие аккаунтов</h3>
                                            <button onClick={() => { const hours = prompt('Скрыть всех на часов (0 = отмена):', '0'); if(hours && hours > 0) setGlobalHide(parseInt(hours)); else if(hours === '0') db.collection('settings').doc('global').set({ hideUntil: null }, { merge: true }); }}>Установить скрытие</button>
                                            <p style={{fontSize:'0.8rem'}}>Все аккаунты будут скрыты в чате до указанного времени.</p>
                                        </div>
                                        <h3>Все игры</h3>
                                        {allGames.map(game => (
                                            <div key={game.id} className="game-item-row">
                                                <span>{game.title} {game.isBuiltIn ? '(встроенная)' : `(автор: ${game.author})`} 👥 {game.playersCount || 0}</span>
                                                <div>
                                                    <button onClick={() => { editCustomGame(game); setIsRightDrawerOpen(false); }}>✏️</button>
                                                    {!game.isBuiltIn && <button onClick={() => { confirmDeleteGame(game.id); setIsRightDrawerOpen(false); }}>🗑️</button>}
                                                    <button onClick={() => toggleGameVisibility(game)}>{game.publicVisible ? '🔒 Скрыть' : '🌍 Опубликовать'}</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}
                
                {/* Модалки */}
                {groupCreateModal.open && (
                    <div className="modal-overlay" onClick={() => setGroupCreateModal({ open: false, userId: null })}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <h2>Добавить пользователя</h2>
                            <button className="btn-save" onClick={() => { const name = prompt('Введите название группы'); if(name) createGroup(name, groupCreateModal.userId); }}>➕ Создать новую группу</button>
                            {userGroups.length > 0 && <h3>Или добавить в существующую:</h3>}
                            {userGroups.map(g => (
                                <div key={g.id} className="group-item" onClick={() => addToExistingGroup(g.id, groupCreateModal.userId)}>👥 {g.name}</div>
                            ))}
                            <div className="modal-actions"><button className="btn-cancel" onClick={() => setGroupCreateModal({ open: false, userId: null })}>Закрыть</button></div>
                        </div>
                    </div>
                )}
                {isEditModalOpen && (
                    <div className="modal-overlay" onClick={() => setIsEditModalOpen(false)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <h2>Редактировать игру</h2>
                            <input type="text" placeholder="Название" value={editTitle} onChange={e => setEditTitle(e.target.value)} />
                            <textarea rows="6" placeholder="HTML код" value={editHtml} onChange={e => setEditHtml(e.target.value)} />
                            <input type="text" placeholder="URL превью (картинка)" value={editPreviewUrl} onChange={e => setEditPreviewUrl(e.target.value)} />
                            <div className="modal-actions"><button className="btn-cancel" onClick={() => setIsEditModalOpen(false)}>Отмена</button><button className="btn-save" onClick={saveEditedGame}>Сохранить</button></div>
                        </div>
                    </div>
                )}
                {statsModal.open && (
                    <div className="modal-overlay" onClick={() => setStatsModal({ open: false, game: null, stats: null })}>
                        <div className="modal-content">
                            <h2>Аналитика: {statsModal.game?.title}</h2>
                            <h3>🟢 Сейчас играют ({statsModal.stats?.activePlayers?.length || 0})</h3>
                            {statsModal.stats?.activePlayers?.map((p, i) => <div key={i} className="stat-item">👤 {p.nickname}</div>)}
                            <h3>📜 Все игроки за всё время ({statsModal.stats?.allPlayers?.length || 0})</h3>
                            {statsModal.stats?.allPlayers?.map((p, i) => <div key={i} className="stat-item">👤 {p.nickname} (последний раз: {new Date(p.lastPlayed).toLocaleString()})</div>)}
                            <div className="modal-actions"><button className="btn-cancel" onClick={() => setStatsModal({ open: false, game: null, stats: null })}>Закрыть</button></div>
                        </div>
                    </div>
                )}
                {deleteConfirmModal.open && (
                    <div className="modal-overlay" onClick={() => setDeleteConfirmModal({ open: false, gameId: null })}>
                        <div className="modal-content">
                            <h2>Удалить игру?</h2>
                            <p>Это действие нельзя отменить.</p>
                            <div className="modal-actions"><button className="btn-cancel" onClick={() => setDeleteConfirmModal({ open: false, gameId: null })}>Отмена</button><button className="btn-save" onClick={deleteCustomGame}>Удалить</button></div>
                        </div>
                    </div>
                )}
                {mazeSizeModal && (
                    <div className="modal-overlay" onClick={() => setMazeSizeModal(null)}>
                        <div className="modal-content">
                            <h2>Выберите сложность</h2>
                            <select id="mazeSizeSelect" defaultValue="10"><option value="10">Лёгкий (10x10)</option><option value="15">Средний (15x15)</option><option value="20">Сложный (20x20)</option></select>
                            <div className="modal-actions"><button className="btn-cancel" onClick={() => setMazeSizeModal(null)}>Отмена</button><button onClick={() => startMazeWithSize(parseInt(document.getElementById('mazeSizeSelect').value))}>Играть</button></div>
                        </div>
                    </div>
                )}
                {fullscreenAvatar && (
                    <div className="modal-overlay" onClick={() => setFullscreenAvatar(null)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <img src={fullscreenAvatar} alt="Fullscreen avatar" style={{maxWidth:'90vw', maxHeight:'90vh', borderRadius:'16px'}} />
                        </div>
                    </div>
                )}
                {contextMenu.visible && (
                    <div className="message-context-menu" style={{ position: 'fixed', top: contextMenu.y, left: contextMenu.x, zIndex: 1000 }}>
                        <div onClick={copyMessageText}>📋 Скопировать</div>
                        <div onClick={deleteMessage}>🗑️ Удалить</div>
                    </div>
                )}
                
                {/* Полноэкранный режим с вкладками */}
                {openGames.length > 0 && (
                    <div className="fullscreen-overlay">
                        <div className="fullscreen-header">
                            <div className="tabs-container">
                                {openGames.map(game => (
                                    <div key={game.id} className={`game-tab ${activeGameId === game.id ? 'active' : ''}`} onClick={() => setActiveGameId(game.id)}>
                                        {game.title}
                                        <button className="game-tab-close" onClick={(e) => { e.stopPropagation(); closeGameTab(game.id); }}>✕</button>
                                    </div>
                                ))}
                                <button className="close-fullscreen" onClick={closeAllGames}>Закрыть всё</button>
                            </div>
                        </div>
                        {openGames.map(game => (
                            <iframe key={game.id} className="fullscreen-iframe" srcDoc={game.html} style={{ display: activeGameId === game.id ? 'block' : 'none' }} sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups" title={game.title} />
                        ))}
                    </div>
                )}
            </div>
        );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
