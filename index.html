    function getClickerGame(saved) { const start = saved?.score || 0; return '<!DOCTYPE html><html><head><style>body{background:#1e1e2f;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:system-ui;}.game{text-align:center;color:white;}button{font-size:28px;padding:16px 32px;border-radius:60px;background:#4f46e5;color:white;cursor:pointer;}.score{font-size:48px;font-weight:bold;}</style></head><body><div class="game"><h2>🍪 Печеньки</h2><div class="score" id="counter">'+start+'</div><button id="clickBtn">Клик!</button></div><script>let count='+start+';const c=document.getElementById("counter");document.getElementById("clickBtn").onclick=()=>{count++;c.innerText=count;window.parent.postMessage({type:"saveProgress",gameId:"clicker",progress:{score:count}},"*");};window.addEventListener("load",()=>window.parent.postMessage({type:"saveProgress",gameId:"clicker",progress:{score:count}},"*"));<\/script></body></html>'; }
    function getSnakeGame(saved) { const data = saved || { score: 0, wrapAround: false }; return '<!DOCTYPE html><html><head><style>body{background:#0a0f1e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{background:#1e293b;}</style></head><body><canvas id="canvas" width="400" height="400"></canvas><div><span id="score">'+data.score+'</span> <label><input type="checkbox" id="wrap" '+ (data.wrapAround?'checked':'') +'> Сквозь стены</label> <button id="reset">Новая</button></div><script>(function(){const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");let grid=20,cell=20,snake=[{x:10,y:10}],dir="RIGHT",next="RIGHT",food={x:15,y:10},score='+data.score+',wrap='+data.wrapAround+',gameActive=true,loop;function save(){window.parent.postMessage({type:"saveProgress",gameId:"snake",progress:{score,wrapAround:wrap}},"*");}function randomFood(){let free=[];for(let i=0;i<grid;i++)for(let j=0;j<grid;j++)if(!snake.some(s=>s.x===i&&s.y===j))free.push({x:i,y:j});return free.length?free[Math.floor(Math.random()*free.length)]:null;}function draw(){ctx.fillStyle="#1e293b";ctx.fillRect(0,0,400,400);ctx.fillStyle="#facc15";ctx.fillRect(food.x*cell,food.y*cell,cell-1,cell-1);ctx.fillStyle="#10b981";snake.forEach(s=>ctx.fillRect(s.x*cell,s.y*cell,cell-1,cell-1));}function move(){if(!gameActive)return;dir=next;let head={...snake[0]};if(dir==="RIGHT")head.x++;if(dir==="LEFT")head.x--;if(dir==="UP")head.y--;if(dir==="DOWN")head.y++;let hit=false;if(wrap){if(head.x<0)head.x=grid-1;if(head.x>=grid)head.x=0;if(head.y<0)head.y=grid-1;if(head.y>=grid)head.y=0;}else{if(head.x<0||head.x>=grid||head.y<0||head.y>=grid)hit=true;}let self=snake.some(s=>s.x===head.x&&s.y===head.y);if(hit||self){gameActive=false;clearInterval(loop);loop=null;alert("Game over");return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById("score").innerText=score;let f=randomFood();if(f)food=f;else{gameActive=false;clearInterval(loop);alert("You win!");}save();}else{snake.pop();}draw();}function start(){if(loop)clearInterval(loop);gameActive=true;snake=[{x:10,y:10}];dir="RIGHT";next="RIGHT";score=0;document.getElementById("score").innerText=score;food=randomFood()||{x:5,y:5};draw();loop=setInterval(move,130);save();}document.getElementById("reset").onclick=start;document.getElementById("wrap").onchange=e=>{wrap=e.target.checked;save();};window.addEventListener("keydown",e=>{if(!gameActive)return;if(e.key==="ArrowUp"&&dir!=="DOWN")next="UP";if(e.key==="ArrowDown"&&dir!=="UP")next="DOWN";if(e.key==="ArrowLeft"&&dir!=="RIGHT")next="LEFT";if(e.key==="ArrowRight"&&dir!=="LEFT")next="RIGHT";});start();})();<\/script></body></html>'; }
    function getColorMemoryGame(saved) { const level = saved?.level || 1; const seq = saved?.sequence || []; return '<!DOCTYPE html><html><head><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;}.game{background:#1e293b;padding:24px;border-radius:48px;}.colors{display:flex;gap:20px;}.color-btn{width:80px;height:80px;border-radius:20px;cursor:pointer;}</style></head><body><div class="game"><div>Уровень <span id="level">'+level+'</span></div><div class="colors" id="panel"><div class="color-btn" style="background:#ef4444" data-c="red"></div><div class="color-btn" style="background:#3b82f6" data-c="blue"></div><div class="color-btn" style="background:#10b981" data-c="green"></div><div class="color-btn" style="background:#f59e0b" data-c="yellow"></div></div><div id="status">Запомни!</div><button id="reset">Заново</button></div><script>let level='+level+',sequence='+JSON.stringify(seq)+',playerTurn=false,playerIdx=0,colors=["red","blue","green","yellow"];const statusDiv=document.getElementById("status"),levelSpan=document.getElementById("level");function save(){window.parent.postMessage({type:"saveProgress",gameId:"colorMemory",progress:{level,sequence}},"*");}function addColor(){sequence.push(colors[Math.floor(Math.random()*4)]);}async function showSequence(){playerTurn=false;statusDiv.innerText="Смотри!";for(let c of sequence){const btn=document.querySelector(".color-btn[data-c=\""+c+"\"]");if(btn){btn.style.opacity="0.4";await new Promise(r=>setTimeout(r,400));btn.style.opacity="1";await new Promise(r=>setTimeout(r,200));}}playerTurn=true;playerIdx=0;statusDiv.innerText="Твоя очередь!";}function handleClick(color){if(!playerTurn)return;if(color===sequence[playerIdx]){playerIdx++;if(playerIdx===sequence.length){level++;levelSpan.innerText=level;addColor();save();showSequence();}}else{statusDiv.innerText="Ошибка! Нажми \"Заново\"";playerTurn=false;}}document.querySelectorAll(".color-btn").forEach(btn=>btn.addEventListener(     function get2048Game(saved) { const best = saved?.bestScore || 0; return '<!DOCTYPE html><html><head><style>body{background:#1a202c;display:flex;justify-content:center;align-items:center;height:100vh;}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;background:#1e293b;padding:16px;border-radius:24px;}.cell{width:80px;height:80px;background:#334155;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:white;border-radius:16px;}</style></head><body><div><div>Счёт: <span id="score">0</span> Лучший: <span id="best">'+best+'</span></div><div class="grid" id="grid"></div><button id="reset">Новая игра</button></div><script>let grid=Array(4).fill().map(()=>Array(4).fill(0)),score=0,best='+best+';const gridDiv=document.getElementById("grid"),scoreSpan=document.getElementById("score"),bestSpan=document.getElementById("best");function save(){window.parent.postMessage({type:"saveProgress",gameId:"game2048",progress:{bestScore:best}},"*");}function addRandom(){let empty=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(grid[i][j]===0)empty.push([i,j]);if(empty.length){let [x,y]=empty[Math.floor(Math.random()*empty.length)];grid[x][y]=Math.random()<0.9?2:4;}}function render(){gridDiv.innerHTML="";for(let i=0;i<4;i++)for(let j=0;j<4;j++){let val=grid[i][j];let cell=document.createElement("div");cell.className="cell";cell.textContent=val||"";cell.style.background=val?"#4f46e5":"#334155";gridDiv.appendChild(cell);}scoreSpan.innerText=score;if(score>best){best=score;bestSpan.innerText=best;save();}}function move(dx,dy){let changed=false,newScore=0;for(let i=0;i<4;i++){let line=[];for(let j=0;j<4;j++){let x=dx===0?(dy===1?j:3-j):(dx===1?i:3-i);let y=dy===0?(dx===1?j:3-j):(dy===1?i:3-i);if(dx===0)line.push(grid[y][x]);else line.push(grid[x][y]);}let newLine=line.filter(v=>v!==0);for(let k=0;k<newLine.length-1;k++)if(newLine[k]===newLine[k+1]){newLine[k]*=2;newScore+=newLine[k];newLine.splice(k+1,1);}while(newLine.length<4)newLine.push(0);for(let j=0;j<4;j++){let oldVal=dx===0?grid[dy===1?j:3-j][dx===1?i:3-i]:grid[dx===1?i:3-i][dy===1?j:3-j];let newVal=newLine[j];if(oldVal!==newVal)changed=true;if(dx===0)grid[dy===1?j:3-j][dx===1?i:3-i]=newVal;else grid[dx===1?i:3-i][dy===1?j:3-j]=newVal;}}if(changed){score+=newScore;addRandom();render();save();}}function reset(){score=0;grid=Array(4).fill().map(()=>Array(4).fill(0));addRandom();addRandom();render();save();}window.addEventListener("keydown",e=>{if(e.key==="ArrowUp")move(0,-1);if(e.key==="ArrowDown")move(0,1);if(e.key==="ArrowLeft")move(-1,0);if(e.key==="ArrowRight")move(1,0);});reset();<\/script></body></html>'; }
    function getHangmanGame() { return '<!DOCTYPE html><html><head><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;color:white;}</style></head><body><div><h2>Виселица</h2><div id="word"></div><div id="guesses"></div><input id="letter" maxlength="1"><button id="guess">Угадать</button><button id="new">Новое слово</button><script>const words=["react","javascript","html","game","fun","developer"];let word="",guessed=[],wrong=0;const wordDiv=document.getElementById("word"),guessesDiv=document.getElementById("guesses");function update(){wordDiv.innerText=word.split("").map(l=>guessed.includes(l)?l:"_").join(" ");guessesDiv.innerText="Ошибки: "+wrong;if(wrong>=6)alert("Вы проиграли!");if(!wordDiv.innerText.includes("_"))alert("Победа!");}function newGame(){word=words[Math.floor(Math.random()*words.length)];guessed=[];wrong=0;update();}document.getElementById("guess").onclick=()=>{let l=document.getElementById("letter").value.toLowerCase();if(l&&!guessed.includes(l)){guessed.push(l);if(!word.includes(l))wrong++;update();}document.getElementById("letter").value="";};document.getElementById("new").onclick=newGame;newGame();<\/script></div></body></html>'; }
    function getTicTacToeGame() { return '<!DOCTYPE html><html><head><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;}.board{display:grid;grid-template-columns:repeat(3,100px);gap:5px;}.cell{width:100px;height:100px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;color:white;}</style></head><body><div><div class="board" id="board"></div><button id="reset">Сброс</button><script>let board=Array(9).fill(null),turn="X";const boardDiv=document.getElementById("board");function checkWinner(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(let l of lines){if(board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[0]]===board[l[2]])return board[l[0]];}return board.includes(null)?null:"Ничья";}function render(){boardDiv.innerHTML="";for(let i=0;i<9;i++){let cell=document.createElement("div");cell.className="cell";cell.innerText=board[i]||"";cell.onclick=()=>{if(!board[i]&&!checkWinner()){board[i]=turn;turn=turn==="X"?"O":"X";render();if(checkWinner())alert("Победитель: "+checkWinner());}};boardDiv.appendChild(cell);}}document.getElementById("reset").onclick=()=>{board=Array(9).fill(null);turn="X";render();};render();<\/script></div></body></html>'; }
    function getFlappyGame(saved) { const best = saved?.bestScore || 0; return '<!DOCTYPE html><html><head><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid white;}</style></head><body><div><canvas id="canvas" width="400" height="500"></canvas><div>Счёт: <span id="score">0</span> Лучший: <span id="best">'+best+'</span></div><button id="restart">Рестарт</button><script>const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");let bird={y:250,vy:0},gravity=0.2,lift=-4,pipes=[],frame=0,score=0,best='+best+',gameActive=true;function save(){window.parent.postMessage({type:"saveProgress",gameId:"flappy",progress:{bestScore:best}},"*");}function addPipe(){pipes.push({x:400,width:60,top:Math.random()*250+50,gap:120});}function update(){if(!gameActive)return;bird.vy+=gravity;bird.y+=bird.vy;if(bird.y<0||bird.y>500)gameActive=false;if(frame%90===0)addPipe();for(let i=0;i<pipes.length;i++){let p=pipes[i];p.x-=2;if(p.x+60<0){pipes.splice(i,1);i--;score++;document.getElementById("score").innerText=score;if(score>best){best=score;document.getElementById("best").innerText=best;save();}}if(p.x<60&&p.x+60>40){if(bird.y<p.top||bird.y>p.top+p.gap)gameActive=false;}}frame++;}function draw(){ctx.fillStyle="#0f172a";ctx.fillRect(0,0,400,500);ctx.fillStyle="#10b981";ctx.fillRect(40,bird.y,20,20);ctx.fillStyle="#ef4444";for(let p of pipes){ctx.fillRect(p.x,0,60,p.top);ctx.fillRect(p.x,p.top+p.gap,60,500-p.top-p.gap);}}function gameLoop(){update();draw();if(gameActive)requestAnimationFrame(gameLoop);else alert("Game over! Счёт: "+score);}function restart(){bird.y=250;bird.vy=0;pipes=[];frame=0;score=0;gameActive=true;document.getElementById("score").innerText=0;gameLoop();}document.addEventListener("keydown",()=>{if(gameActive)bird.vy=lift;});document.getElementById("restart").onclick=restart;restart();<\/script></div></body></html>'; }
    function getMazeGame(saved) { const size = saved?.size || 10; return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.container{text-align:center;}.maze{display:grid;gap:1px;background:#1e293b;margin:20px auto;}.cell{width:30px;height:30px;background:#334155;}.wall{background:#0f172a;}.player{background:#facc15;}.goal{background:#10b981;}.controls{margin-top:10px;color:white;}</style></head><body><div class="container"><div>Размер: '+size+'x'+size+'</div><div id="maze" class="maze" style="grid-template-columns:repeat('+size+',30px);"></div><div id="status" style="color:white">Найди выход (жёлтый)</div><div class="controls"><button id="reset">Новая игра</button> <button id="back">← Назад к выбору сложности</button></div></div><script>const SIZE='+size+';let maze=Array(SIZE).fill().map(()=>Array(SIZE).fill(0));let px=1,py=1;const gx=SIZE-2,gy=SIZE-2;function generate(){for(let y=0;y<SIZE;y++){for(let x=0;x<SIZE;x++){if(x===0||y===0||x===SIZE-1||y===SIZE-1)maze[y][x]=1;else maze[y][x]=Math.random()<0.35?1:0;}}maze[1][1]=0;maze[gy][gx]=0;px=1;py=1;}function render(){const mazeDiv=document.getElementById("maze");mazeDiv.style.gridTemplateColumns="repeat("+SIZE+",30px)";mazeDiv.innerHTML="";for(let y=0;y<SIZE;y++){for(let x=0;x<SIZE;x++){const cell=document.createElement("div");cell.className="cell";if(maze[y][x]===1)cell.classList.add("wall");if(x===px&&y===py)cell.classList.add("player");if(x===gx&&y===gy)cell.classList.add("goal");mazeDiv.appendChild(cell);}}}function move(dx,dy){const nx=px+dx,ny=py+dy;if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&maze[ny][nx]!==1){px=nx;py=ny;render();if(px===gx&&py===gy){setTimeout(()=>{alert("Победа!");generate();render();},50);}}}window.addEventListener("keydown",e=>{if(e.key==="ArrowUp")move(0,-1);else if(e.key==="ArrowDown")move(0,1);else if(e.key==="ArrowLeft")move(-1,0);else if(e.key==="ArrowRight")move(1,0);});document.getElementById("reset").onclick=()=>{generate();render();};document.getElementById("back").onclick=()=>{window.parent.postMessage({type:"changeMazeSize"},"*");};generate();render();window.parent.postMessage({type:"saveProgress",gameId:"maze",progress:{size:SIZE}},"*");<\/script></body></html>'; }
    function getBullsAndCowsGame() { return '<!DOCTYPE html><html><head><style>body{background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui;}.game{text-align:center;}.attempts{list-style:none;padding:0;}</style></head><body><div class="game"><h2>🐂 Быки и коровы</h2><div id="message"></div><input id="guess" placeholder="4 цифры" maxlength="4"><button id="submit">Проверить</button><button id="new">Новая игра</button><ul id="attempts" class="attempts"></ul><script>let secret="",attempts=[];function generate(){let digits=[];while(digits.length<4){let d=Math.floor(Math.random()*10);if(!digits.includes(d))digits.push(d);}secret=digits.join("");}function check(guess){let bulls=0,cows=0;for(let i=0;i<4;i++){if(guess[i]===secret[i])bulls++;else if(secret.includes(guess[i]))cows++;}return{bulls,cows};}function render(){const list=document.getElementById("attempts");list.innerHTML=attempts.map(a=>`<li>${a.guess} → ${a.bulls} быков, ${a.cows} коров</li>`).join("");}document.getElementById("submit").onclick=()=>{const inp=document.getElementById("guess");const val=inp.value;if(val.length!==4||new Set(val).size!==4){alert("Введите 4 разные цифры");return;}const res=check(val);attempts.push({guess:val,bulls:res.bulls,cows:res.cows});render();inp.value="";if(res.bulls===4){alert("Поздравляем! Вы угадали число!");generate();attempts=[];render();}};document.getElementById("new").onclick=()=>{generate();attempts=[];render();document.getElementById("message").innerText="";};generate();<\/script></body></html>'; }
    function getSudokuGame() { return '<!DOCTYPE html><html><head><style>body{background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;}.sudoku{display:grid;grid-template-columns:repeat(9,40px);gap:2px;background:#1e293b;}.cell{width:40px;height:40px;background:#334155;color:white;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;}.cell input{width:100%;height:100%;text-align:center;background:transparent;border:none;color:white;font-size:20px;}</style></head><body><div><div class="sudoku" id="board"></div><button id="check">Проверить</button><button id="new">Новая</button><script>const boardEl=document.getElementById("board");let board=Array(9).fill().map(()=>Array(9).fill(0));function generatePuzzle(){const puzzle=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];board=puzzle.map(row=>[...row]);}function render(){boardEl.innerHTML="";for(let r=0;r<9;r++){for(let c=0;c<9;c++){const cell=document.createElement("div");cell.className="cell";if(board[r][c]!==0){cell.textContent=board[r][c];}else{const inp=document.createElement("input");inp.type="text";inp.maxLength=1;inp.addEventListener("input",e=>{const val=parseInt(e.target.value);board[r][c]=isNaN(val)?0:val;});cell.appendChild(inp);}boardEl.appendChild(cell);}}}document.getElementById("check").onclick=()=>alert("Проверка не реализована полностью");document.getElementById("new").onclick=()=>{generatePuzzle();render();};generatePuzzle();render();<\/script></body></html>'; }

            const unsubscribeAuth = auth.onAuthStateChanged(async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                    unsubscribe = await loadUserData(currentUser.uid);
                } else {
                    setUserData(null); setCustomGames([]); setGameProgress({}); setGameHistory([]);
                    setLoading(false);
                }
            });
            return () => {
                unsubscribeAuth();
                if (unsubscribe) unsubscribe();
            };
        }, [loadUserData]);

        useEffect(() => {
            if (user && userData) saveUserData(user.uid, { ...userData, gameProgress, gameHistory });
        }, [user, userData, gameProgress, gameHistory, saveUserData]);

        useEffect(() => {
            window.addEventListener('message', handleMessage);
            return () => window.removeEventListener('message', handleMessage);
        }, [handleMessage]);

        useEffect(() => {
            if (!user) return;
            const chatsRef = db.collection('chats');
            const unsubscribe = chatsRef.where('participants', 'array-contains', user.uid).onSnapshot(snapshot => {
                const counts = {};
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const other = data.participants.find(p => p !== user.uid);
                    if (!other) return;
                    const unread = data.messages?.filter(m => m.sender !== user.uid && !m.readBy?.includes(user.uid)).length || 0;
                    if (unread > 0) counts[other] = unread;
                });
                setUnreadCounts(counts);
            });
            return () => unsubscribe();
        }, [user]);

        useEffect(() => {
            const fetchEdits = async () => {
                const editsSnap = await db.collection('builtinEdits').get();
                const edits = {};
                editsSnap.docs.forEach(doc => { edits[doc.id] = doc.data(); });
                setBuiltinEdits(edits);
            };
            fetchEdits();
        }, []);

        useEffect(() => {
            if (!user) return;
            const fetchSeen = async () => {
                const seenSnap = await db.collection('users').doc(user.uid).collection('gameSeen').get();
                const seen = {};
                seenSnap.docs.forEach(doc => { seen[doc.id] = doc.data().lastSeen?.toDate?.() || null; });
                setUserLastSeen(seen);
            };
            fetchSeen();
        }, [user]);

        const checkNicknameUnique = async (nick) => {
            const snapshot = await db.collection('users').where('nickname', '==', nick).get();
            return snapshot.empty;
        };

        const handleSetNickname = async (nick) => {
            if (!nick.trim()) return alert('Введите ник');
            if (!await checkNicknameUnique(nick)) return alert('Ник уже занят');
            const newData = { ...userData, nickname: nick };
            await saveUserData(user.uid, newData);
            setUserData(newData);
            setNicknameModalOpen(false);
        };

        const handleRegister = async () => {
            if (!nickname.trim()) return setAuthError('Введите ник');
            if (!await checkNicknameUnique(nickname)) return setAuthError('Ник уже занят');
            try {
                setAuthError('');
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).set({
                    email, nickname, gameProgress: {}, gameHistory: [], banned: false, premium: false, isAdmin: false, avatar: null
                });
            } catch (err) { setAuthError(err.message); }
        };

        const handleLogin = async () => {
            try { setAuthError(''); await auth.signInWithEmailAndPassword(email, password); }
            catch (err) { setAuthError(err.message); }
        };

        const signInWithGoogle = async () => {
            try {
                const result = await auth.signInWithPopup(googleProvider);
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    await db.collection('users').doc(result.user.uid).set({
                        email: result.user.email, nickname: '', gameProgress: {}, gameHistory: [], banned: false, premium: false, isAdmin: false, avatar: null
                    });
                    setNicknameModalOpen(true);
                } else if (userDoc.data().banned) {
                    await auth.signOut();
                    alert('Аккаунт забанен');
                }
            } catch (err) { 
                if (err.message.includes('unauthorized-domain')) {
                    setAuthError('Ошибка: домен не авторизован. Добавьте в Firebase Console -> Authentication -> Authorized domains: ' + window.location.hostname);
                } else {
                    setAuthError(err.message);
                }
            }
        };

        const logout = () => { auth.signOut(); setIsRightDrawerOpen(false); };

        const loadAllUsers = async () => {
            const snapshot = await db.collection('users').get();
            setUsersList(snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() })));
        };

        const toggleBanUser = async (uid, banned) => {
            if (!isAdmin) return;
            await db.collection('users').doc(uid).update({ banned });
            loadAllUsers();
        };

        const togglePremium = async (uid, premium) => {
            if (!isAdmin) return;
            await db.collection('users').doc(uid).update({ premium });
            loadAllUsers();
        };

        const toggleAdmin = async (uid, makeAdmin) => {
            if (!isAdmin) return;
            await db.collection('users').doc(uid).update({ isAdmin: makeAdmin });
            loadAllUsers();
            if (uid === user.uid) setUserData(prev => ({ ...prev, isAdmin: makeAdmin }));
        };

        const addNewGame = async () => {
            const newId = 'user_' + Date.now();
            const newGame = {
                id: newId, title: 'Моя игра',
                html: '<div style="color:white; background:#333; padding:20px;">Ваша игра</div>',
                author: userData.nickname || user.email?.split('@')[0],
                authorId: user.uid,
                publicVisible: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastEdited: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                await db.collection('games').doc(newId).set(newGame);
                editCustomGame({ ...newGame, isBuiltIn: false });
            } catch (error) { alert('Ошибка добавления игры: ' + error.message); }
        };

        const editCustomGame = (game) => {
            setEditingProject(game); setEditTitle(game.title); setEditHtml(game.html || (game.getHtmlFunc ? game.getHtmlFunc(null) : '')); setIsEditModalOpen(true);
        };

        const saveEditedGame = async () => {
            if (!editingProject) return;
            const updateData = { title: editTitle, html: editHtml, lastEdited: firebase.firestore.FieldValue.serverTimestamp() };
            try {
                if (editingProject.isBuiltIn) {
                    const editRef = db.collection('builtinEdits').doc(editingProject.id);
                    await editRef.set({ title: editTitle, html: editHtml, lastEdited: firebase.firestore.FieldValue.serverTimestamp() });
                    const editsSnap = await db.collection('builtinEdits').get();
                    const edits = {};
                    editsSnap.docs.forEach(doc => { edits[doc.id] = doc.data(); });
                    setBuiltinEdits(edits);
                } else {
                    await db.collection('games').doc(editingProject.id).update(updateData);
                }
                setIsEditModalOpen(false); setEditingProject(null);
            } catch (error) { alert('Ошибка сохранения: ' + error.message); }
        };

        const confirmDeleteGame = (id) => setDeleteConfirmModal({ open: true, gameId: id });

        const deleteCustomGame = async () => {
            const id = deleteConfirmModal.gameId;
            if (!id) return;
            try {
                await db.collection('games').doc(id).delete();
                setGameProgress(prev => { const np = {...prev}; delete np[id]; return np; });
                setGameHistory(prev => prev.filter(h => h.id !== id));
                setDeleteConfirmModal({ open: false, gameId: null });
            } catch (error) { alert('Ошибка удаления: ' + error.message); }
        };

        const toggleGameVisibility = async (game) => {
            if (!game.isBuiltIn) {
                await db.collection('games').doc(game.id).update({ publicVisible: !game.publicVisible });
            } else if (isAdmin) {
                const editRef = db.collection('builtinEdits').doc(game.id);
                const current = await editRef.get();
                await editRef.set({ hidden: !(current.data()?.hidden), lastEdited: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                const editsSnap = await db.collection('builtinEdits').get();
                const edits = {};
                editsSnap.docs.forEach(doc => { edits[doc.id] = doc.data(); });
                setBuiltinEdits(edits);
            }
        };

        const addToHistory = (gameId, gameTitle) => {
            setGameHistory(prev => {
                if (prev.find(item => item.id === gameId)) return prev;
                return [...prev, { id: gameId, title: gameTitle, firstPlayed: new Date().toISOString() }];
            });
            if (user) {
                const lastSeenRef = db.collection('users').doc(user.uid).collection('gameSeen').doc(gameId);
                lastSeenRef.set({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
            }
        };

        const openGame = async (project, isBuiltIn, getHtmlFunc) => {
            if (project.id === 'maze') { setMazeSizeModal(project); return; }
            addToHistory(project.id, project.title);
            let finalHtml;
            if (isBuiltIn) {
                const edit = builtinEdits[project.id];
                if (edit && edit.html) finalHtml = edit.html;
                else finalHtml = getHtmlFunc(gameProgress[project.id] || null);
            } else {
                finalHtml = project.html;
            }
            setFullscreenGame({ ...project, html: finalHtml, isBuiltIn });
        };

        const closeFullscreen = () => setFullscreenGame(null);

        const downloadGame = (project) => {
            const html = project.isBuiltIn ? (builtinEdits[project.id]?.html || project.getHtmlFunc(gameProgress[project.id] || null)) : project.html;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${project.title}.html`; a.click();
            URL.revokeObjectURL(url);
        };

        const startMazeWithSize = (size) => {
            const project = mazeSizeModal; setMazeSizeModal(null);
            addToHistory(project.id, project.title);
            const progress = { ...(gameProgress[project.id] || {}), size };
            setGameProgress(prev => ({ ...prev, [project.id]: progress }));
            const html = project.getHtmlFunc(progress);
            setFullscreenGame({ ...project, html, isBuiltIn: true });
        };

        const showGameStats = async (game) => {
            const activeSnapshot = await db.collection('activeSessions').where('gameId', '==', game.id).get();
            const activePlayers = activeSnapshot.docs.map(doc => ({ nickname: doc.data().nickname, userId: doc.data().userId }));
            const usersSnapshot = await db.collection('users').get();
            const allPlayers = [];
            usersSnapshot.docs.forEach(doc => {
                const history = doc.data().gameHistory || [];
                const played = history.find(h => h.id === game.id);
                if (played) allPlayers.push({ nickname: doc.data().nickname || doc.data().email, lastPlayed: played.firstPlayed });
            });
            setStatsModal({ open: true, game, stats: { activePlayers, allPlayers } });
        };

        const selectChatUser = async (otherUser) => {
            if (chatUnsubscribeRef.current) { chatUnsubscribeRef.current(); chatUnsubscribeRef.current = null; }
            setSelectedChatUser(otherUser);
            const chatId = [user.uid, otherUser.uid].sort().join('_');
            const chatRef = db.collection('chats').doc(chatId);
            const chatDoc = await chatRef.get();
            if (chatDoc.exists) {
                const messages = chatDoc.data().messages || [];
                let updated = false;
                const newMessages = messages.map(m => {
                    if (m.sender !== user.uid && !m.readBy?.includes(user.uid)) {
                        updated = true;
                        return { ...m, readBy: [...(m.readBy || []), user.uid] };
                    }
                    return m;
                });
                if (updated) await chatRef.update({ messages: newMessages });
            }
            const unsubscribe = chatRef.onSnapshot(doc => {
                if (doc.exists) setChatMessages(doc.data().messages || []);
                else setChatMessages([]);
                setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
            });
            chatUnsubscribeRef.current = unsubscribe;
        };

        const sendMessage = async () => {
            if (!newMessage.trim() || !selectedChatUser) return;
            const chatId = [user.uid, selectedChatUser.uid].sort().join('_');
            const chatRef = db.collection('chats').doc(chatId);
            const message = { text: newMessage, sender: user.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp(), readBy: [user.uid] };
            const chatDoc = await chatRef.get();
            if (chatDoc.exists) {
                await chatRef.update({ messages: firebase.firestore.FieldValue.arrayUnion(message), participants: [user.uid, selectedChatUser.uid] });
            } else {
                await chatRef.set({ participants: [user.uid, selectedChatUser.uid], messages: [message] });
            }
            setNewMessage('');
            setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
        };

        const openRightDrawer = async (tab) => {
            await loadAllUsers();
            setDrawerTab(tab);
            setIsRightDrawerOpen(true);
        };

        if (loading) {
            return ( <div className="loading-error"><h2>Загрузка...</h2>{loadError && <p style={{color: 'red'}}>{loadError}</p>}{loadError && <button className="retry-btn" onClick={() => window.location.reload()}>Повторить</button>}</div> );
        }

        if (!user) {
            const isFileProtocol = window.location.protocol === 'file:';
            return (
                <div className="auth-container">
                    <h2>{authMode === 'login' ? 'Вход' : 'Регистрация'}</h2>
                    {isFileProtocol && (<div className="server-warning">⚠️ Вы открыли файл локально. Firebase требует HTTP-сервер. Запустите <code>npx serve</code> в папке с файлом.</div>)}
                    {authMode === 'register' && <input type="text" placeholder="Никнейм" value={nickname} onChange={e => setNickname(e.target.value)} />}
                    <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
                    <input type="password" placeholder="***" value={password} onChange={e => setPassword(e.target.value)} />
                    {authError && <div className="error">{authError}</div>}
                    <button onClick={authMode === 'login' ? handleLogin : handleRegister}>{authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                    <button className="google-btn" onClick={signInWithGoogle}>🟦 Войти через Google</button>
                    <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}>{authMode === 'login' ? 'Нет аккаунта? Создать' : 'Уже есть аккаунт? Войти'}</button>
                </div>
            );
        }

        if (nicknameModalOpen) {
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <h2>Придумайте никнейм</h2>
                        <input type="text" placeholder="Никнейм" onChange={e => setNickname(e.target.value)} />
                        <button onClick={() => handleSetNickname(nickname)}>Сохранить</button>
                    </div>
                </div>
            );
        }

        const enrichedBuiltin = builtinProjects.map(game => {
            const edit = builtinEdits[game.id];
            return { ...game, title: edit?.title || game.title, html: edit?.html || null, getHtmlFunc: edit?.html ? () => edit.html : game.getHtmlFunc, lastEdited: edit?.lastEdited?.toDate?.() || null, publicVisible: !(edit?.hidden === true) };
        });

        const enrichedCustomGames = customGames.map(game => {
            const authorUser = usersList.find(u => u.uid === game.authorId) || {};
            return { ...game, authorPremium: authorUser.premium || false, isBuiltIn: false };
        });

        const allGames = [...enrichedBuiltin, ...enrichedCustomGames];
        
        let displayedGames = allGames.filter(game => {
            if (game.publicVisible) return true;
            if (isAdmin) return true;
            if (game.authorId === user.uid) return true;
            return false;
        });
        if (showMyGamesOnly) displayedGames = displayedGames.filter(g => g.authorId === user.uid || g.isBuiltIn);
        if (showPremiumOnly) displayedGames = displayedGames.filter(g => g.authorPremium === true);
        if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            displayedGames = displayedGames.filter(g => g.title.toLowerCase().includes(q));
        }

        const isGameUpdated = (game) => {
            if (!game.lastEdited) return false;
            const lastSeen = userLastSeen[game.id];
            if (!lastSeen) return true;
            return game.lastEdited > lastSeen;
        };

        const gamesWithProgress = Object.keys(gameProgress).filter(id => gameProgress[id] && Object.keys(gameProgress[id]).length > 0).map(id => allGames.find(g => g.id === id)).filter(Boolean);

        return (
            <div className="app">
                <header className="app-header">
                    <button className="burger-btn" onClick={() => setIsMenuOpen(true)}>☰</button>
                    <h1 className="site-title">🎮 Игровой мир</h1>
                    <div className="search-container"><input className="search-input" placeholder="🔍 Поиск игр..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} /></div>
                    <div style={{display:'flex', alignItems:'center'}}>
                        <button className="theme-toggle" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>{theme === 'light' ? '🌙' : '☀️'}</button>
                        <button className="account-btn" onClick={() => openRightDrawer('profile')}>
                            {userData?.avatar ? <img src={userData.avatar} className="account-avatar-small" alt="avatar" /> : <span>👤</span>}
                            {userData?.nickname || user.email?.split('@')[0]} {isPremium && <span className="premium-star">⭐</span>} {isAdmin && <span className="admin-badge">Админ</span>}
                            {Object.values(unreadCounts).some(c => c>0) && <span className="unread-dot"></span>}
                        </button>
                    </div>
                </header>

                <main className="projects-grid">
                    {displayedGames.length === 0 && <div className="empty-message">Нет доступных игр.</div>}
                    {displayedGames.map(proj => {
                        const updated = isGameUpdated(proj);
                        return (
                            <div key={proj.id} className={`project-card ${updated ? 'card-updated' : ''}`} onClick={() => openGame(proj, proj.isBuiltIn, proj.getHtmlFunc)}>
                                <div className="card-preview"><iframe className="preview-iframe" srcDoc={proj.isBuiltIn ? (proj.getHtmlFunc?.(null) || '<div>Загрузка...</div>') : proj.html} sandbox="allow-scripts allow-same-origin" title={proj.title} /></div>
                                <div className="card-info">
                                    <div className="card-title-row">
                                        <span className="card-title">{proj.title}</span>
                                        <div className="card-actions">
                                            <button className="download-btn" onClick={e => { e.stopPropagation(); downloadGame(proj); }}>💾</button>
                                            {(isAdmin || (!proj.isBuiltIn && user.uid === proj.authorId)) && (
                                                <button className="edit-btn" onClick={e => { e.stopPropagation(); editCustomGame(proj); }}>✏️</button>
                                            )}
                                            {(!proj.isBuiltIn && (user.uid === proj.authorId || isAdmin)) && (
                                                <button className="delete-btn" onClick={e => { e.stopPropagation(); confirmDeleteGame(proj.id); }}>🗑️</button>
                                            )}
                                            <button className="visibility-btn" onClick={e => { e.stopPropagation(); toggleGameVisibility(proj); }} title={proj.publicVisible ? "Публичная" : "Приватная"}>{proj.publicVisible ? '🌍' : '🔒'}</button>
                                            <button className="stats-btn" onClick={e => { e.stopPropagation(); showGameStats(proj); }}>📊</button>
                                        </div>
                                    </div>
                                    <div className="card-author">👤 {proj.author} {proj.authorPremium && <span className="premium-star">⭐</span>}{!proj.publicVisible && <span style={{marginLeft:'8px', fontSize:'0.7rem', background:'#f97316', padding:'2px 6px', borderRadius:'12px'}}>Приватная</span>}</div>
                                </div>
                            </div>
                        );
                    })}
                </main>

                <button className="fab" onClick={addNewGame}>+</button>

                {isMenuOpen && (<div className="menu-overlay" onClick={() => setIsMenuOpen(false)}><aside className="sidebar" onClick={e => e.stopPropagation()}><h2>📋 Меню</h2><div className="menu-section"><h3>🎮 Фильтры</h3><div className="menu-game-item" onClick={() => { setShowMyGamesOnly(true); setShowPremiumOnly(false); setIsMenuOpen(false); }}>Только мои игры</div><div className="menu-game-item" onClick={() => { setShowMyGamesOnly(false); setShowPremiumOnly(false); setIsMenuOpen(false); }}>Все игры</div><div className="menu-game-item" onClick={() => { setShowPremiumOnly(true); setShowMyGamesOnly(false); setIsMenuOpen(false); }}>⭐ Премиум игры</div></div><div className="menu-section"><h3>📈 Прогресс</h3>{gamesWithProgress.length === 0 && <p>Нет сохранённого прогресса</p>}{gamesWithProgress.map(game => (<div key={game.id} className="menu-game-item" onClick={() => { setIsMenuOpen(false); openGame(game, game.isBuiltIn, game.getHtmlFunc); }}>🎮 {game.title}</div>))}</div><div className="menu-section"><h3>🕘 История игр</h3>{gameHistory.length === 0 && <p>Вы ещё не играли</p>}{gameHistory.map(item => { const game = allGames.find(g => g.id === item.id); if (!game) return null; return (<div key={item.id} className="menu-game-item" onClick={() => { setIsMenuOpen(false); openGame(game, game.isBuiltIn, game.getHtmlFunc); }}>🕹️ {game.title} <span className="history-date">({new Date(item.firstPlayed).toLocaleString()})</span></div>); })}</div></aside></div>)}

                {isRightDrawerOpen && (<div className="menu-overlay" onClick={() => setIsRightDrawerOpen(false)}><div className="right-drawer" onClick={e => e.stopPropagation()}><div className="drawer-header"><h3>Аккаунт</h3><button className="drawer-close" onClick={() => setIsRightDrawerOpen(false)}>✕</button></div><div className="drawer-tabs"><div className={`drawer-tab ${drawerTab === 'profile' ? 'active' : ''}`} onClick={() => setDrawerTab('profile')}>Профиль</div><div className={`drawer-tab ${drawerTab === 'chat' ? 'active' : ''}`} onClick={() => { setDrawerTab('chat'); loadAllUsers(); }}>Чат</div>{isAdmin && <div className={`drawer-tab ${drawerTab === 'admin' ? 'active' : ''}`} onClick={() => { setDrawerTab('admin'); loadAllUsers(); }}>Админ</div>}</div><div className="drawer-content">{drawerTab === 'profile' && (<div className="account-info">{userData?.avatar ? <img src={userData.avatar} className="account-avatar-large" alt="avatar" /> : <div className="account-avatar-large">{(userData?.nickname?.[0] || user.email[0]).toUpperCase()}</div>}<div className="avatar-input"><input type="text" placeholder="URL аватара" value={avatarUrl} onChange={e => setAvatarUrl(e.target.value)} /><input type="file" accept="image/*" onChange={e => setAvatarFile(e.target.files[0])} /><button onClick={uploadAvatar} disabled={uploadingAvatar}>{uploadingAvatar ? 'Загрузка...' : 'Загрузить аватар'}</button></div><div className="account-nick">{userData?.nickname || user.email.split('@')[0]} {isPremium && <span className="premium-star">⭐</span>} {isAdmin && <span className="admin-badge">Админ</span>}</div><div className="account-email">{user.email}</div><button className="logout-btn" onClick={logout}>Выйти</button></div>)}
                {drawerTab === 'chat' && (<div style={{display:'flex', flexDirection:'column', gap:'16px'}}>{!selectedChatUser ? (<div className="chat-users-list"><h4>Пользователи</h4>{usersList.filter(u => u.uid !== user.uid).map(u => (<div key={u.uid} className="user-list-item" onClick={() => selectChatUser(u)}>{u.avatar ? <img src={u.avatar} className="user-avatar" alt="avatar" /> : <div className="user-avatar">{u.nickname?.[0] || u.email[0].toUpperCase()}</div>}<div className="user-info"><div className="user-name">{u.nickname || u.email.split('@')[0]} {u.premium && <span className="premium-star">⭐</span>} {u.isAdmin && <span className="admin-badge">Админ</span>}</div><div className="user-email">{u.email}</div></div>{unreadCounts[u.uid] > 0 && <span style={{background:'var(--unread-dot)', color:'white', borderRadius:'12px', padding:'2px 8px'}}>{unreadCounts[u.uid]}</span>}</div>))}</div>) : (<div className="chat-conversation"><button className="back-button" onClick={() => { if(chatUnsubscribeRef.current) chatUnsubscribeRef.current(); setSelectedChatUser(null); }}>← Назад к списку</button><div className="chat-messages">{chatMessages.map((msg, idx) => (<div key={idx} className={`message ${msg.sender === user.uid ? 'sent' : 'received'}`}><div>{msg.text}</div><div className="message-time">{msg.timestamp?.toDate?.().toLocaleTimeString() || ''}</div></div>))}<div ref={messagesEndRef} /></div><div className="chat-input-area"><input className="chat-input" value={newMessage} onChange={e => setNewMessage(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} placeholder="Сообщение..." /><button onClick={sendMessage} style={{padding:'10px 20px', borderRadius:'40px', background:'var(--accent)', color:'white', border:'none'}}>Отправить</button></div></div>)}</div>)}
                {drawerTab === 'admin' && isAdmin && (<div style={{display:'flex', flexDirection:'column', gap:'24px'}}><div><h3>Пользователи</h3>{usersList.map(u => (<div key={u.uid} className="admin-user-row">{u.avatar ? <img src={u.avatar} className="user-avatar" alt="avatar" /> : <div className="user-avatar">{u.nickname?.[0] || '?'}</div>}<div className="user-info"><div className="user-name">{u.nickname} {u.premium && <span className="premium-star">⭐</span>} {u.isAdmin && <span className="admin-badge">Админ</span>} {u.banned && <span className="banned-tag">Забанен</span>}</div><div className="user-email">{u.email}</div></div><button onClick={() => toggleBanUser(u.uid, !u.banned)}>{u.banned ? 'Разбанить' : 'Забанить'}</button><button onClick={() => togglePremium(u.uid, !u.premium)}>{u.premium ? 'Снять премиум' : '⭐ Дать премиум'}</button><button onClick={() => toggleAdmin(u.uid, !u.isAdmin)}>{u.isAdmin ? 'Забрать админку' : 'Сделать админом'}</button></div>))}</div><div><h3>Все игры</h3>{allGames.map(game => (<div key={game.id} className="game-item-row"><span>{game.title} {game.isBuiltIn ? '(встроенная)' : `(автор: ${game.author})`}</span><div><button onClick={() => { editCustomGame(game); setIsRightDrawerOpen(false); }}>✏️</button>{!game.isBuiltIn && <button onClick={() => { confirmDeleteGame(game.id); setIsRightDrawerOpen(false); }}>🗑️</button>}<button onClick={() => toggleGameVisibility(game)}>{game.publicVisible ? '🔒 Скрыть' : '🌍 Опубликовать'}</button></div></div>))}</div></div>)}
                </div></div></div>)}

                {isEditModalOpen && (<div className="modal-overlay" onClick={() => setIsEditModalOpen(false)}><div className="modal-content" onClick={e => e.stopPropagation()}><h2>Редактировать игру</h2><label>Название</label><input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)} /><label>HTML код</label><textarea rows="12" value={editHtml} onChange={e => setEditHtml(e.target.value)} /><div className="modal-actions"><button className="btn-cancel" onClick={() => setIsEditModalOpen(false)}>Отмена</button><button className="btn-save" onClick={saveEditedGame}>Сохранить</button></div></div></div>)}

                {statsModal.open && (<div className="modal-overlay" onClick={() => setStatsModal({ open: false, game: null, stats: null })}><div className="modal-content" onClick={e => e.stopPropagation()}><h2>Аналитика: {statsModal.game?.title}</h2><h3>🟢 Играют сейчас ({statsModal.stats?.activePlayers?.length || 0})</h3>{statsModal.stats?.activePlayers?.map((p, i) => <div key={i} className="stat-item">👤 {p.nickname || p.userId}</div>)}<h3>📜 Все игроки за всё время ({statsModal.stats?.allPlayers?.length || 0})</h3>{statsModal.stats?.allPlayers?.map((p, i) => <div key={i} className="stat-item">👤 {p.nickname} (последний раз: {new Date(p.lastPlayed).toLocaleString()})</div>)}<div className="modal-actions"><button className="btn-cancel" onClick={() => setStatsModal({ open: false, game: null, stats: null })}>Закрыть</button></div></div></div>)}

                {deleteConfirmModal.open && (<div className="modal-overlay" onClick={() => setDeleteConfirmModal({ open: false, gameId: null })}><div className="modal-content" onClick={e => e.stopPropagation()}><h2>Удалить игру?</h2><p>Это действие нельзя отменить.</p><div className="modal-actions"><button className="btn-cancel" onClick={() => setDeleteConfirmModal({ open: false, gameId: null })}>Отмена</button><button className="btn-save" onClick={deleteCustomGame}>Удалить</button></div></div></div>)}

                {mazeSizeModal && (<div className="modal-overlay" onClick={() => setMazeSizeModal(null)}><div className="modal-content" onClick={e => e.stopPropagation()}><h2>Выберите сложность лабиринта</h2><select id="mazeSizeSelect" defaultValue="10"><option value="10">Лёгкий (10×10)</option><option value="15">Средний (15×15)</option><option value="20">Сложный (20×20)</option></select><div className="modal-actions"><button className="btn-cancel" onClick={() => setMazeSizeModal(null)}>Отмена</button><button className="btn-save" onClick={() => { const sel = document.getElementById('mazeSizeSelect'); startMazeWithSize(parseInt(sel.value)); }}>Играть</button></div></div></div>)}

                {fullscreenGame && (<div className="fullscreen-overlay"><div className="fullscreen-header"><button className="close-fullscreen" onClick={closeFullscreen}>← Шаг назад</button><span>{fullscreenGame.title}</span></div><iframe className="fullscreen-iframe" srcDoc={fullscreenGame.html} sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups" title={fullscreenGame.title} /></div>)}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
